name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          set -euo pipefail
          ZIP=$(ls -1 *.zip | head -1)
          echo "Found zip: $ZIP"
          unzip -q "$ZIP" -d _unpacked
          PKG=$(find _unpacked -maxdepth 3 -name package.json -not -path "*/node_modules/*" -print -quit)
          if [ -z "$PKG" ]; then
            echo "::error::No package.json found inside $ZIP"
            find _unpacked -maxdepth 3 | head -50
            exit 1
          fi
          ROOT=$(dirname "$PKG")
          echo "Project root: $ROOT"
          mkdir -p app_src
          cp -r "$ROOT"/. app_src/
          rm -rf app_src/android app_src/ios app_src/.github app_src/node_modules
          ls -la app_src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: app_src
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Generate the native Android project
        working-directory: app_src
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: app_src/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        id: collect
        run: |
          set -euo pipefail
          APK=$(find app_src/android -name "*.apk" -path "*release*" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::Gradle finished but produced no APK"
            find app_src/android -name "*.apk" | head
            exit 1
          fi
          cp "$APK" BunkBank.apk
          ls -lh BunkBank.apk
          echo "stamp=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Upload as an artifact
        if: always() && hashFiles('BunkBank.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BunkBank-apk
          path: BunkBank.apk
          retention-days: 30

      - name: Publish it to Releases
        if: hashFiles('BunkBank.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.collect.outputs.stamp }}
          name: BunkBank ${{ steps.collect.outputs.stamp }}
          body: |
            Tap **BunkBank.apk** under Assets to install.

            Uninstall BunkBank v1 first - this is signed with a different key,
            so Android will otherwise refuse with "App not installed".
          files: BunkBank.apk
          fail_on_unmatched_files: false
