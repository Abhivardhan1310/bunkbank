name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          set -euo pipefail
          ZIP=$(ls -1 *.zip | head -1)
          echo "Found zip: $ZIP"
          unzip -q "$ZIP" -d _unpacked
          PKG=$(find _unpacked -maxdepth 3 -name package.json -not -path "*/node_modules/*" -print -quit)
          if [ -z "$PKG" ]; then
            echo "::error::No package.json found inside $ZIP"
            exit 1
          fi
          ROOT=$(dirname "$PKG")
          echo "Project root: $ROOT"
          mkdir -p app_src
          cp -r "$ROOT"/. app_src/
          rm -rf app_src/android app_src/ios app_src/.github app_src/node_modules
          ls -la app_src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: app_src
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Generate the native Android project
        working-directory: app_src
        run: npx expo prebuild --platform android --no-install

      - name: Tune the Gradle build
        working-directory: app_src/android
        run: |
          set -euo pipefail
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g/' gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          grep -E "reactNativeArchitectures|jvmargs" gradle.properties

      # No --stacktrace: it buries the real message under 1000 lines of
      # Gradle internals. The log is captured so the next step can extract it.
      - name: Build the APK
        id: build
        continue-on-error: true
        working-directory: app_src/android
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show the real error
        if: steps.build.outcome == 'failure'
        run: |
          echo "=================== WHAT WENT WRONG ==================="
          awk '/\* What went wrong:/,/\* Try:/' build.log | head -80 || true
          echo ""
          echo "=================== FAILING TASKS ====================="
          grep -nE "^> Task .*FAILED|^FAILURE:|^e: |error:|Caused by:|Execution failed" build.log \
            | grep -v "org.gradle.internal" | head -40 || true
          echo ""
          echo "=================== LAST 50 LINES ====================="
          grep -v "^	at org.gradle" build.log | tail -50 || true
          exit 1

      - name: Upload the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect the APK
        id: collect
        if: always()
        run: |
          APK=$(find app_src/android -name "*.apk" -path "*release*" -print -quit || true)
          if [ -z "$APK" ]; then
            echo "No APK produced."
            exit 0
          fi
          cp "$APK" BunkBank.apk
          ls -lh BunkBank.apk
          echo "stamp=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Upload as an artifact
        if: always() && hashFiles('BunkBank.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BunkBank-apk
          path: BunkBank.apk
          retention-days: 30

      - name: Publish it to Releases
        if: hashFiles('BunkBank.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.collect.outputs.stamp }}
          name: BunkBank ${{ steps.collect.outputs.stamp }}
          body: |
            Tap **BunkBank.apk** under Assets to install.

            Uninstall BunkBank v1 first - this is signed with a different key,
            so Android will otherwise refuse with "App not installed".
          files: BunkBank.apk
          fail_on_unmatched_files: false
