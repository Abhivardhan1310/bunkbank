name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          set -euo pipefail
          ZIP=$(ls -1 *.zip | head -1)
          echo "Found zip: $ZIP"
          unzip -q "$ZIP" -d _unpacked
          PKG=$(find _unpacked -maxdepth 3 -name package.json -not -path "*/node_modules/*" -print -quit)
          [ -n "$PKG" ] || { echo "::error::No package.json inside $ZIP"; exit 1; }
          ROOT=$(dirname "$PKG")
          echo "Project root: $ROOT"
          mkdir -p app_src
          cp -r "$ROOT"/. app_src/
          rm -rf app_src/android app_src/ios app_src/.github app_src/node_modules

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK. The setup-android action
      # tries to re-provision it and fails; using what is already installed is
      # both faster and what worked before.
      - name: Use the runner's Android SDK
        run: |
          set -euo pipefail
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          echo "Using SDK at $SDK"
          ls "$SDK" || { echo "::error::No Android SDK on this runner"; exit 1; }
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          mkdir -p "$SDK/licenses"
          # Gradle downloads the platform and NDK it needs; these are the
          # standard published license hashes that let it do so unattended.
          printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > "$SDK/licenses/android-sdk-preview-license"

      - name: Install dependencies
        working-directory: app_src
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Generate the native Android project
        working-directory: app_src
        run: npx expo prebuild --platform android --no-install

      - name: Tune the Gradle build
        working-directory: app_src/android
        run: |
          set -euo pipefail
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g/' gradle.properties
          grep -E "reactNativeArchitectures|jvmargs" gradle.properties

      - name: Build the APK
        id: build
        continue-on-error: true
        working-directory: app_src/android
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show the real error
        if: steps.build.outcome == 'failure'
        run: |
          echo "================ WHAT WENT WRONG ================"
          awk '/\* What went wrong:/,/\* Try:/' build.log || true
          echo ""
          echo "================ FAILING TASKS =================="
          grep -nE "^> Task .*FAILED|^FAILURE:|^e: |error:|Execution failed" build.log \
            | grep -v "org.gradle.internal" | head -30 || true
          echo ""
          echo "================ LAST 40 LINES =================="
          grep -v "^	at org.gradle" build.log | tail -40 || true
          exit 1

      - name: Upload the build log
        if: always()
        run: gzip -9 build.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log.gz
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect the APK
        id: collect
        if: always()
        run: |
          APK=$(find app_src/android -name "*.apk" -path "*release*" -print -quit || true)
          [ -n "$APK" ] || { echo "No APK produced."; exit 0; }
          cp "$APK" BunkBank.apk
          ls -lh BunkBank.apk
          echo "stamp=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Upload as an artifact
        if: always() && hashFiles('BunkBank.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BunkBank-apk
          path: BunkBank.apk
          retention-days: 30

      - name: Publish it to Releases
        if: hashFiles('BunkBank.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.collect.outputs.stamp }}
          name: BunkBank ${{ steps.collect.outputs.stamp }}
          body: |
            Tap **BunkBank.apk** under Assets to install.
            Then Settings - Export or import data - Import, and paste your backup.
          files: BunkBank.apk
          fail_on_unmatched_files: false
