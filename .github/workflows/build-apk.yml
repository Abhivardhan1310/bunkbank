name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          set -euo pipefail
          ZIP=$(ls -1 *.zip | head -1)
          echo "Found zip: $ZIP"
          unzip -q "$ZIP" -d _unpacked
          PKG=$(find _unpacked -maxdepth 3 -name package.json -not -path "*/node_modules/*" -print -quit)
          [ -n "$PKG" ] || { echo "::error::No package.json inside $ZIP"; exit 1; }
          ROOT=$(dirname "$PKG")
          echo "Project root: $ROOT"
          mkdir -p app_src
          cp -r "$ROOT"/. app_src/
          rm -rf app_src/android app_src/ios app_src/.github app_src/node_modules

      # Node 20 matches react-native 0.86's engines field. Node 22 moved the
      # failure earlier, so it is not the version to be on.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: app_src
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Generate the native Android project
        working-directory: app_src
        run: npx expo prebuild --platform android --no-install

      # Pre-flight: run the node commands Gradle shells out to, so an obvious
      # breakage surfaces with a readable error instead of "exit value 1".
      - name: Check the node helpers Gradle depends on
        working-directory: app_src
        run: |
          echo "node: $(node --version)"
          echo "--- expo config ---"
          npx expo config --json --type public > /dev/null && echo OK
          echo "--- autolinking resolve ---"
          npx expo-modules-autolinking resolve -p android --json > /dev/null && echo OK
          echo "--- react-native config ---"
          npx expo-modules-autolinking react-native-config --json --platform android > /dev/null && echo OK

      - name: Tune the Gradle build
        working-directory: app_src/android
        run: |
          set -euo pipefail
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g/' gradle.properties
          grep -E "reactNativeArchitectures|jvmargs" gradle.properties

      # --info makes Gradle print the full command line of every process it
      # spawns, which is the only way to see which `node` call is failing.
      - name: Build the APK
        id: build
        continue-on-error: true
        working-directory: app_src/android
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain --info 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show the real error
        if: steps.build.outcome == 'failure'
        run: |
          echo "============= NODE COMMANDS GRADLE RAN ============="
          grep -n "Command: node" build.log | tail -8 || echo "(none found)"
          echo ""
          echo "============= CONTEXT AT THE FAILURE =============="
          LAST=$(grep -n "Command: node" build.log | tail -1 | cut -d: -f1 || true)
          if [ -n "$LAST" ]; then
            START=$([ "$LAST" -gt 10 ] && echo $((LAST - 10)) || echo 1)
            sed -n "${START},$((LAST + 80))p" build.log
          fi
          echo ""
          echo "============= WHAT WENT WRONG ====================="
          awk '/\* What went wrong:/,/\* Try:/' build.log || true
          echo ""
          echo "============= LAST 40 USEFUL LINES ================"
          grep -v "^	at org.gradle" build.log | tail -40 || true
          exit 1

      - name: Upload the full build log
        if: always()
        run: gzip -9 build.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log.gz
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect the APK
        id: collect
        if: always()
        run: |
          APK=$(find app_src/android -name "*.apk" -path "*release*" -print -quit || true)
          [ -n "$APK" ] || { echo "No APK produced."; exit 0; }
          cp "$APK" BunkBank.apk
          ls -lh BunkBank.apk
          echo "stamp=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Upload as an artifact
        if: always() && hashFiles('BunkBank.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BunkBank-apk
          path: BunkBank.apk
          retention-days: 30

      - name: Publish it to Releases
        if: hashFiles('BunkBank.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.collect.outputs.stamp }}
          name: BunkBank ${{ steps.collect.outputs.stamp }}
          body: |
            Tap **BunkBank.apk** under Assets to install.

            Uninstall BunkBank v1 first - different signing key.
          files: BunkBank.apk
          fail_on_unmatched_files: false

